name: Build DolphinPS4 PKG

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-ps4-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            python3 \
            clang \
            lld \
            libssl-dev
            
      - name: Download & Extract OpenOrbis Toolchain
        run: |
          sudo mkdir -p /opt/toolchain
          # -L follows redirects, -f fails fast on HTTP errors (e.g., 404)
          curl -fL -o toolchain.tar.gz https://github.com/OpenOrbis/PS4-Toolchain/releases/download/v1.0.0/toolchain.tar.gz
          sudo tar -xzf toolchain.tar.gz -C /opt/toolchain
          rm toolchain.tar.gz

          echo "OO_PS4_TOOLCHAIN=/opt/toolchain" >> $GITHUB_ENV
          echo "/opt/toolchain/bin" >> $GITHUB_PATH
        
      - name: Build DolphinPS4 Binary
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=/opt/toolchain/cmake/vsi.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -GNinja
          ninja

      - name: Generate PKG File
        run: |
          # Build/pack the PS4 homebrew assets into a PKG format
          # Using OpenOrbis create-pkg tool or custom packaging script
          cd build
          /opt/toolchain/bin/create-pkg --gp4 ../pkg/DolphinPS4.gp4 --out DolphinPS4.pkg || \
          /opt/toolchain/bin/orbis-pub-cmd img_create ../pkg/param.sfo DolphinPS4.pkg

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DolphinPS4-PKG
          path: build/*.pkg
          retention-days: 7
