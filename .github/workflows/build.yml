name: Build DolphinPS4

on:
  push:
    tags:
      - "v*.*"
  workflow_dispatch:
    inputs:
      dolphin_ps4_version:
        description: "Version shown under Settings -> About"
        required: true
        default: "02.95"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OPENORBIS: /opt/pacbrew/ps4/openorbis
      DOLPHIN_PS4_VERSION: ${{ github.event.inputs.dolphin_ps4_version || '02.95' }}
      BUILD_ROOT: ${{ github.workspace }}/dolphinps4-build
    steps:
      - name: Check out DolphinPS4
        uses: actions/checkout@v4
        with:
          path: DolphinPS4

      - name: Show repo layout (debug)
        run: |
          cd $GITHUB_WORKSPACE/DolphinPS4
          ls -la
          find . -maxdepth 2 \( -name '*.patch' -o -name '*.sh' -o -name 'BUILDING*' \) -not -path './.git/*'

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "DOLPHIN_PS4_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt -yq update
          sudo apt -yq install git build-essential cmake zip \
            pacman-package-manager makepkg libarchive-tools autoconf libtool \
            nasm curl ninja-build glslang-tools python3-pip python3-venv
          python3 -m venv $BUILD_ROOT/mesa-venv
          source $BUILD_ROOT/mesa-venv/bin/activate
          pip install meson mako pyyaml

      - name: Install ps4 toolchain
        run: |
          sudo tee -a /etc/pacman.conf > /dev/null <<EOF
          [pacbrew]
          SigLevel = Optional TrustAll
          Server = https://pacman.mydedibox.fr/pacbrew/packages/
          EOF
          sudo pacman -Syu
          sudo pacman --noconfirm -S ps4-openorbis ps4-openorbis-portlibs

      - name: Cache Mesa build tree
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_ROOT }}/src/mesa
          key: mesa-26.0.8-${{ runner.os }}

      - name: Clone and patch upstream Dolphin
        run: |
          mkdir -p $BUILD_ROOT/src
          git clone https://github.com/dolphin-emu/dolphin $BUILD_ROOT/src/dolphin
          cd $BUILD_ROOT/src/dolphin
          git checkout 771fb154059c5812d6a715a23226249cc42877a2
          git submodule update --init --recursive
          git apply $GITHUB_WORKSPACE/DolphinPS4/patches/dolphin-ps4.patch

      - name: Fetch and patch Mesa 26.0.8
        run: |
          if [ ! -d "$BUILD_ROOT/src/mesa/.git" ]; then
            git clone --branch mesa-26.0.8 --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git $BUILD_ROOT/src/mesa
          fi
          cd $BUILD_ROOT/src/mesa
          git apply $GITHUB_WORKSPACE/DolphinPS4/patches/mesa-ps4.patch

      - name: Configure Dolphin
        run: |
          source $BUILD_ROOT/mesa-venv/bin/activate
          cd $GITHUB_WORKSPACE/DolphinPS4
          ./scripts/configure-dolphin.sh

      - name: Package Dolphin
        run: |
          cd $GITHUB_WORKSPACE/DolphinPS4
          DOLPHIN_PS4_VERSION=$DOLPHIN_PS4_VERSION scripts/package-dolphin.sh

      - name: Attach .pkg to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BUILD_ROOT }}/out/*.pkg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .pkg as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DolphinPS4-${{ env.DOLPHIN_PS4_VERSION }}
          path: ${{ env.BUILD_ROOT }}/out/*.pkg
