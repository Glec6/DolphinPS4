Menu = Menu
Video = Vídeo
Graphics = Gráficos
Performance = Desempenho
System = Sistema
Diagnostics = Diagnóstico
Aspect Ratio = Proporção da tela
Auto = Automático
Stretch = Esticar
The game's picture shape on the TV. = O formato da imagem do jogo na TV.
Letterbox Zoom = Zoom letterbox
Fills a 16:9 TV with games that letterbox a 16:9 picture (Resident Evil 4). = Preenche uma TV 16:9 com jogos que mostram uma imagem 16:9 com faixas (Resident Evil 4).
Widescreen Hack = Hack widescreen
Renders a wider view in 4:3 games (may show glitches at the edges). = Mostra uma visão mais larga em jogos 4:3 (podem aparecer falhas nas bordas).
Crop to Aspect Ratio = Cortar na proporção
Crops the picture to the chosen aspect ratio instead of adding black bars. = Corta a imagem na proporção escolhida em vez de adicionar faixas pretas.
Internal Resolution = Resolução interna
Native (480p) = Nativa (480p)
Sharper pictures at higher settings; costs GPU time. = Imagem mais nítida em valores altos; usa a GPU.
Frame Rate Limit = Limite de quadros
Unlimited = Ilimitado
Auto (60/30) = Automático (60/30)
Caps the frames shown per second. Auto: 60 while the game keeps up, an even 30 when it can't (steadier than a frame rate that bounces around). = Limita os quadros exibidos por segundo. Automático: 60 enquanto o jogo aguenta, 30 estáveis quando não (mais estável que uma taxa que oscila).
V-Sync = V-Sync
Waits for the TV's refresh (no tearing). = Espera a atualização da TV (sem tearing).
FPS Counter = Contador de FPS
Frames and emulation speed in the corner. = Quadros e velocidade de emulação no canto.
Texture Filtering = Filtragem de texturas
Default = Padrão
Smooth (linear) = Suave (linear)
Sharp (nearest) = Nítida (mais próximo)
How textures are smoothed. = Como as texturas são suavizadas.
Anisotropic Filtering = Filtragem anisotrópica
Sharper textures at an angle; costs GPU time. = Texturas mais nítidas em ângulo; usa a GPU.
Anti-Aliasing = Anti-aliasing
Smoother edges; costs GPU time. = Bordas mais suaves; usa a GPU.
Disable Fog = Desativar neblina
Removes distance fog (some games use fog for effects). = Remove a neblina de distância (alguns jogos a usam para efeitos).
Copy Filter = Filtro de cópia
The game's own blur/deflicker filter on copies; Off is sharper. = O filtro de desfoque/anticintilação do próprio jogo nas cópias; Desligado é mais nítido.
EFB Copies = Cópias EFB
To Texture (fast) = Para textura (rápido)
To RAM (accurate) = Para RAM (preciso)
Some effects need RAM copies; Texture is faster. = Alguns efeitos precisam de cópias em RAM; Textura é mais rápido.
CPU Access to EFB = Acesso da CPU ao EFB
Needed by some games (lens flares, cursors); Off is faster. = Necessário em alguns jogos (reflexos de lente, cursores); Desligado é mais rápido.
Manual Texture Sampling = Amostragem manual de texturas
Exact texture sampling (fixes some videos, e.g. FIFA Street 2); slower. = Amostragem exata de texturas (corrige alguns vídeos, ex.: FIFA Street 2); mais lento.
GPU Texture Decoding = Decodificação de texturas na GPU
Decodes game textures on the GPU instead of the video thread (helps draw-heavy scenes). = Decodifica as texturas do jogo na GPU em vez da thread de vídeo (ajuda em cenas pesadas).
Shader Compilation = Compilação de shaders
Asynchronous = Assíncrona
Hybrid Ubershaders = Ubershaders híbridos
Synchronous = Síncrona
Asynchronous: no stutter, objects may appear a moment late. Hybrid Ubershaders: no stutter and nothing missing, costs GPU time. Synchronous: waits for each new shader. = Assíncrona: sem travadas, objetos podem aparecer um instante depois. Ubershaders híbridos: sem travadas e nada faltando, usa a GPU. Síncrona: espera cada shader novo.
Emulated CPU Clock = Clock da CPU emulada
Auto lowers the clock only when the CPU is the limit. = Automático reduz o clock só quando a CPU é o limite.
Speed Features = Recursos de velocidade
Fast = Rápido
Compatible = Compatível
Compatible turns off the port's command-stream shortcuts if a game glitches or freezes. = Compatível desliga os atalhos do port no fluxo de comandos se um jogo falhar ou travar.
Dual Core = Dual Core
Forced = Forçado
Emulates the GPU on its own thread. = Emula a GPU em uma thread própria.
Vulkan Thread = Thread do Vulkan
Records graphics commands on a separate core. = Grava os comandos gráficos em outro núcleo.
Fast Disc Speed = Disco rápido
Shorter loading pauses (rarely breaks a game). = Pausas de carregamento menores (raramente quebra um jogo).
Performance Graphs = Gráficos de desempenho
Frame time and speed graphs on screen. = Gráficos de tempo de quadro e velocidade na tela.
Language = Idioma
The menus' language, and the games' own language where the GameCube or Wii has it. The menu restarts to change it. = O idioma dos menus e, quando o GameCube ou o Wii têm, o dos jogos. O menu reinicia para trocar.
Game Volume = Volume do jogo
Volume of the games' sound. = Volume do som dos jogos.
What is plugged into the Wii Remote. Wii Sports and similar games need None. = O que está conectado ao Wii Remote. Wii Sports e jogos parecidos precisam de Nenhum.
For games played with the Wii Remote held sideways (NSMB Wii, Mario Kart Wii). = Para jogos jogados com o Wii Remote na horizontal (NSMB Wii, Mario Kart Wii).
Audio Buffer = Buffer de áudio
Larger is smoother when a game runs below full speed; smaller has less delay. = Maior fica mais suave quando o jogo roda abaixo da velocidade total; menor tem menos atraso.
All Diagnostics = Todo o diagnóstico
Every switch below at once. Off: nothing is recorded while you play. = Todas as opções abaixo de uma vez. Desligado: nada é registrado enquanto você joga.
Performance Log = Registro de desempenho
Speed, FPS and hitches every 2 seconds (boot-trace.log). = Velocidade, FPS e travadas a cada 2 segundos (boot-trace.log).
Freeze Reports = Relatórios de travamento
Where the emulator was stuck when a game freezes, stalls or starts slowly. = Onde o emulador estava quando um jogo trava, para ou demora a iniciar.
Emulator Log = Registro do emulador
Dolphin's own messages (dolphin.log). = As mensagens do próprio Dolphin (dolphin.log).
Profiler = Profiler
Records where the time goes (samples.log). Costs speed - only for diagnosing slow games. = Registra onde o tempo é gasto (samples.log). Custa velocidade - só para analisar jogos lentos.
