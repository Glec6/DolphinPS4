# Dolphin for PS4 - built-in defaults (/app0/xmb/ps4-defaults.ini), tuned on a base PS4.
# /data/DolphinPS4/ps4.ini, if present, is read after this file and overrides any value; the
# XMB and in-game menu settings (settings.ini) come on top (DolphinNoGUI/PS4Settings.h).

jit_memory=regular
cpu_core=jit
fastmem=on
dual_core=on
sync_gpu=off
sync_gpu_distance=1000000
cpu_clock=auto
cpu_clock_min=50
cpu_thread_core=2
gpu_thread_core=3
audio_thread_core=4
thread_priority=0
accurate_fmadds=off
efb_access=on
shader_cache=on
uniform_upload=subdata
uniform_merge=auto
audio_buffer=100
gpu_cmdbuf_mb=4
fast_disc=on
vertex_upload=ring
show_fps=on
pagetable_fastmem=off
profile=off
screenshots=off
dump=off
diagnostics=off
fifo_batch=on
fifo_defer=on
perfmon=on
vk_thread=on
wii_extension=nunchuk
wii_sideways=off

# Per-game settings (game ID from the disc header; 3 characters = every region).

[GCBE7D]
# Crash Bandicoot: The Wrath of Cortex - its performance counters aren't needed (~2% faster).
perfmon=off

[GUP]
# Shadow the Hedgehog - Dolphin forces single core for it; dual core is twice as fast here.
dual_core=force

[G4B]
# Resident Evil 4 - fill the TV with its letterboxed picture.
zoom=letterbox

[GFY]
# FIFA Street 2 - EA's VP6 videos need exact texture sampling; one of the command-stream
# shortcuts drops menu items in this game.
manual_texture_sampling=on
tex_hash_once=on
fifo_defer=off
jit_gp_fuse=off
jit_lazy_lfs=off
cpu_clock=100

[GAL]
# Super Smash Bros. Melee - busy matches are CPU-bound; below 40% the game itself drops frames
# (30%: ~25 FPS, 35%: ~46, 40% and up: ~60), above it the emulator falls behind.
cpu_clock_min=40

[RB7]
# Bully: Scholarship Edition - busy scenes are CPU-bound at the 50% floor (80% busy, GPU 11%,
# 71% speed / 15 FPS). Test: the auto clock may go down to 40% (Melee's floor).
cpu_clock_min=40

[GK2]
# Spider-Man 2 - the deferred FIFO flushes broke it ("Unknown Opcode" 3 s in); they now switch off
# by themselves for games that need MMU emulation, and the other shortcuts are fine: 8 minutes at
# 28.6 FPS average, 30 FPS most of the time (v03.25).
speed_mode=fast

[G9R]
# Crash Tag Team Racing - its game INI turns SyncOnSkipIdle off; with the command-stream
# shortcuts the GPU FIFO broke ("Unknown Opcode") and the game froze.
jit_lazy_lfs=off
fifo_defer=off
jit_gp_fuse=off
fifo_batch=off

# Wii games played with the Wii Remote alone (a Nunchuk makes them ask to remove it).
[RSP]
# Wii Sports
wii_extension=none
[RZT]
# Wii Sports Resort
wii_extension=none
[RHA]
# Wii Play
wii_extension=none

# Wii games played with the Wii Remote held sideways.
[SMN]
# New Super Mario Bros. Wii
wii_extension=none
wii_sideways=on
[RMC]
# Mario Kart Wii
wii_extension=none
wii_sideways=on
[SUK]
# Kirby's Return to Dream Land
wii_extension=none
wii_sideways=on
[RSB]
# Super Smash Bros. Brawl
wii_extension=none
wii_sideways=on
